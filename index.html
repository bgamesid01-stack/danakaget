<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Update — Kembali Lagi Nanti</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --warning: #f59e0b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15), transparent 40%);
  }

  .container {
    max-width: 520px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 48px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.06);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), #a855f7, var(--warning));
  }

  /* Ikon animasi */
  .icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.3);
    animation: float 3s ease-in-out infinite;
  }

  .icon svg {
    width: 44px;
    height: 44px;
    stroke: var(--primary);
    animation: spin 6s linear infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, #cbd5e1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  p {
    color: var(--muted);
    font-size: 15px;
  }

  .divider {
    width: 60px;
    height: 3px;
    margin: 24px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), #a855f7);
  }

  .note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* Progress dots */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
  }

  .dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    opacity: 0.3;
    animation: blink 1.4s infinite;
  }

  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.2); }
  }

  @media (max-width: 480px) {
    .card { padding: 36px 22px; }
    h1 { font-size: 22px; }
    .icon { width: 72px; height: 72px; }
    .icon svg { width: 36px; height: 36px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="icon">
        <!-- Ikon gear / tools -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </div>

      <h1>Website Sedang Update</h1>
      <p>Kami sedang melakukan pembaruan sistem untuk pengalaman yang lebih baik.</p>

      <div class="divider"></div>

      <p><strong>Silakan kembali lagi nanti.</strong></p>
      <p class="note">Terima kasih atas kesabaran Anda 🙏</p>

      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</body>
</html>
